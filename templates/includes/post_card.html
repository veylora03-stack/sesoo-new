<div class="card">
    {% if post.cover_image %}
        <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" class="card-img-top" style="height: 200px; object-fit: cover;">
    {% else %}
        <div class="card-img-top" style="height: 200px; background-color: var(--color-surface); display: flex; align-items: center; justify-content: center; color: var(--color-muted);">
            بدون تصویر
        </div>
    {% endif %}
    <div class="card-body" style="padding: var(--space-4);">
        <div class="mb-2">
            <a href="{{ post.category.get_absolute_url }}" class="badge" style="background-color: var(--color-primary); color: #fff; padding: 4px 8px; border-radius: var(--radius-sm); text-decoration: none;">{{ post.category.title }}</a>
        </div>
        <h3 class="card-title">{{ post.title }}</h3>
        <p class="text-muted mb-2" style="font-size: 0.875rem;">
            {% if post.published_at %}{{ post.published_at|date:"Y/m/d" }}{% endif %}
        </p>
        <p class="card-text">{{ post.excerpt|truncatewords:20 }}</p>
        <div class="card-actions mt-3">
            <a href="{{ post.get_absolute_url }}" class="btn btn-outline">ادامه مطلب</a>
        </div>
    </div>
</div>
