{% if page_obj.has_other_pages %}
<nav class="pagination-nav mt-6" style="display: flex; justify-content: center; gap: var(--space-2);">
    {% if page_obj.has_previous %}
        <a href="?{% if q %}q={{ q }}&{% endif %}page={{ page_obj.previous_page_number }}" class="btn btn-outline">قبلی</a>
    {% endif %}
    
    <span class="btn btn-ghost" style="cursor: default;">
        صفحه {{ page_obj.number }} از {{ page_obj.paginator.num_pages }}
    </span>

    {% if page_obj.has_next %}
        <a href="?{% if q %}q={{ q }}&{% endif %}page={{ page_obj.next_page_number }}" class="btn btn-outline">بعدی</a>
    {% endif %}
</nav>
{% endif %}
