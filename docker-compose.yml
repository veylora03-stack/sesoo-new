services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file: .env.production
    environment:
      POSTGRES_DB: sesoo_db
      POSTGRES_USER: sesoo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesoo_user -d sesoo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - web

  migrate:
    build: .
    restart: "no"
    env_file: .env.production
    environment:
      DJANGO_ENV: production
      DB_ENGINE: postgresql
      DB_NAME: sesoo_db
      DB_USER: sesoo_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python manage.py migrate --noinput
    networks:
      - web

  web:
    build: .
    restart: unless-stopped
    env_file: .env.production
    environment:
      DJANGO_ENV: production
      DB_ENGINE: postgresql
      DB_NAME: sesoo_db
      DB_USER: sesoo_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz/')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    env_file: .env.production
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
    depends_on:
      web:
        condition: service_healthy
    networks:
      - web

  # Run manually: docker compose run --rm backup
  # Or via cron on host: 0 2 * * * cd /path/to/project && docker compose run --rm backup
  backup:
    image: postgres:16-alpine
    restart: "no"
    env_file: .env.production
    environment:
      POSTGRES_DB: sesoo_db
      POSTGRES_USER: sesoo_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      PGHOST: db
      PGPORT: "5432"
    volumes:
      - ./backups:/backups
      - media_data:/media:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >-
      -c "
      DATE=$$(date +%Y%m%d_%H%M%S) &&
      echo '[$$(date)] Starting backup...' &&
      echo '[$$(date)] Dumping database...' &&
      PGPASSWORD=$$POSTGRES_PASSWORD pg_dump -U $$POSTGRES_USER -h db $$POSTGRES_DB > /backups/db_$$DATE.sql &&
      echo '[$$(date)] Database backup: db_$$DATE.sql' &&
      echo '[$$(date)] Backing up media...' &&
      tar -czf /backups/media_$$DATE.tar.gz -C /media . &&
      echo '[$$(date)] Media backup: media_$$DATE.tar.gz' &&
      find /backups/ -type f -mtime +30 -delete 2>/dev/null || true &&
      echo '[$$(date)] Backup completed. Files:' &&
      ls -lh /backups/*_$$DATE* 2>/dev/null
      "
    networks:
      - web

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge
